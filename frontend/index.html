<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ContestMate - 개인 맞춤형 공모전 통합 알림 서비스</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="위비티, 링커리어, 씽굿 등 국내 공모전 및 대외활동 실시간 맞춤 추천과 D-day 마감 캘린더" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple iOS Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ContestMate" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon.png" />
    <link rel="shortcut icon" href="/icons/favicon.png" />

    <!-- Pretendard font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker for PWA Installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[ContestMate] Service Worker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[ContestMate] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
